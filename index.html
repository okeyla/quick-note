<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>
// 畫面繪製前先套用已存的明暗模式、主題色、字型，避免先閃一下預設樣式
(function () {
  var d = document.documentElement;
  var ok = { theme: ['light', 'dark'], accent: ['indigo', 'teal', 'crimson', 'rose', 'amber', 'violet', 'ink'], font: ['huninn', 'iansui'] };
  for (var k in ok) {
    try { var v = localStorage.getItem('qn-' + k); if (ok[k].indexOf(v) >= 0) d.setAttribute('data-' + k, v); } catch (e) {}
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickNote 備忘錄</title>
<meta name="description" content="用密碼保護的個人備忘錄，可用清單或便利貼瀏覽。">
<meta name="theme-color" content="#1f6b52">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Huninn&family=Iansui&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>QuickNote <small>備忘錄</small></div>
    <div class="spacer"></div>
    <button class="btn ghost hidden" id="btnLock" title="清除這台電腦記住的密碼並回到輸入畫面">鎖定</button>
  </div>
</header>

<main class="wrap">
  <div id="configBanner" class="banner hidden">尚未設定後端網址（index.html 裡的 <code>SUPABASE_URL</code>）。</div>

  <section class="card hidden" id="unlockCard">
    <h2>輸入密碼</h2>
    <div class="row">
      <input type="password" id="password" class="grow" placeholder="備忘錄密碼" autocomplete="off">
      <label class="row" style="gap:6px"><input type="checkbox" id="optRemember" style="width:18px;height:18px"> 在這台電腦記住</label>
      <button class="btn primary" id="btnUnlock">解鎖</button>
    </div>
    <p class="hint" style="margin:8px 0 0">公用電腦請不要勾「記住」。</p>
  </section>

  <section id="notesView" class="hidden">
    <div class="toolbar">
      <div class="row">
        <button class="btn primary" id="btnNew">＋ 新增</button>
        <input type="search" id="search" class="grow" placeholder="搜尋標題、內容、類別" autocomplete="off">
        <div class="seg" id="visFilter" role="group" aria-label="公私篩選">
          <button data-v="all">全部</button><button data-v="public">公</button><button data-v="private">私</button>
        </div>
        <div class="seg" id="viewToggle" role="group" aria-label="瀏覽方式">
          <button data-v="board">便利貼</button><button data-v="list">清單</button>
        </div>
        <button class="btn ghost" id="btnRefresh" title="重新整理">↻</button>
        <button class="btn" id="btnZip" title="把畫面上的備忘錄打包成 ZIP，每則一個 Markdown 檔">⬇ 全部打包</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="類別篩選"></div>
    </div>
    <div class="board hidden" id="board"></div>
    <div class="list hidden" id="list"></div>
    <div class="empty hidden" id="empty"></div>
  </section>
</main>

<dialog id="editor" aria-labelledby="editorHeading">
  <h3 id="editorHeading"></h3>
  <label class="field"><span>標題</span><input type="text" id="fTitle" maxlength="200" autocomplete="off"></label>
  <label class="field"><span>內容</span><textarea id="fContent"></textarea></label>
  <div class="row" style="align-items:flex-end;margin-bottom:16px">
    <div>
      <span class="field-label">公 / 私</span>
      <div class="seg" id="fVis" role="group" aria-label="公或私">
        <button type="button" data-v="private">私</button><button type="button" data-v="public">公</button>
      </div>
    </div>
    <label class="grow">
      <span class="field-label">類別</span>
      <input type="text" id="fCategory" list="catList" maxlength="30" autocomplete="off" placeholder="例如：工作、購物、想法">
    </label>
    <button type="button" class="btn" id="btnClassify" title="讓 AI 依標題和內容建議類別">✨ AI 分類</button>
  </div>
  <datalist id="catList"></datalist>
  <div class="foot">
    <button type="button" class="btn danger hidden" id="btnDelete">刪除</button>
    <button type="button" class="btn" id="btnMd" title="下載成 Markdown 檔">⬇ 下載 .md</button>
    <div class="spacer"></div>
    <button type="button" class="btn" id="btnCancel">取消</button>
    <button type="button" class="btn primary" id="btnSave">儲存</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<!-- 便利貼放大預覽（滑鼠停在便利貼上時顯示） -->
<div class="preview hidden" id="preview" aria-hidden="true">
  <div class="pv-title"></div>
  <div class="pv-text"></div>
  <div class="meta"></div>
  <div class="pv-more">滾動滑鼠滾輪看更多</div>
</div>

<!-- 右下角的配色、字型切換 -->
<div class="fabs">
  <div class="fab-wrap">
    <div class="panel hidden" id="panelTheme" role="dialog" aria-label="配色">
      <div class="panel-title">明暗模式</div>
      <div class="opts" data-pref="theme">
        <button data-v="auto"><i class="sw" style="background:linear-gradient(135deg,#f5f1e8 50%,#16181a 50%)"></i>預設（跟隨電腦）</button>
        <button data-v="light"><i class="sw" style="background:#f5f1e8"></i>淺色</button>
        <button data-v="dark"><i class="sw" style="background:#16181a"></i>深色</button>
      </div>
      <div class="panel-title">主題色</div>
      <div class="opts two" data-pref="accent">
        <button data-v="jade"><i class="sw" style="background:#1f6b52"></i>翡翠綠</button>
        <button data-v="indigo"><i class="sw" style="background:#2b55a8"></i>靛青藍</button>
        <button data-v="teal"><i class="sw" style="background:#0f7285"></i>湖水藍</button>
        <button data-v="crimson"><i class="sw" style="background:#b33a2e"></i>朱砂紅</button>
        <button data-v="rose"><i class="sw" style="background:#a8356a"></i>胭脂粉</button>
        <button data-v="amber"><i class="sw" style="background:#9a5b00"></i>琥珀橙</button>
        <button data-v="violet"><i class="sw" style="background:#6d44a8"></i>紫藤紫</button>
        <button data-v="ink"><i class="sw" style="background:#3d4650"></i>墨石灰</button>
      </div>
    </div>
    <button class="fab" id="fabTheme" data-panel="panelTheme" aria-expanded="false"><span class="ico">🎨</span><span>配色</span></button>
  </div>
  <div class="fab-wrap">
    <div class="panel hidden" id="panelFont" role="dialog" aria-label="字型">
      <div class="panel-title">字型</div>
      <div class="opts" data-pref="font">
        <button data-v="noto" style="font-family:'Noto Sans TC';font-weight:700">思源黑體粗體<small>Noto Sans TC</small></button>
        <button data-v="huninn" style="font-family:Huninn;font-weight:400">粉圓<small>Huninn</small></button>
        <button data-v="iansui" style="font-family:Iansui;font-weight:400">芫荽<small>Iansui</small></button>
      </div>
    </div>
    <button class="fab" id="fabFont" data-panel="panelFont" aria-expanded="false"><span class="ico">Aa</span><span>字型</span></button>
  </div>
</div>

<script>
// 配色、字型切換：選擇存在 localStorage（qn-theme、qn-accent、qn-font），預設值就移除屬性
(() => {
  'use strict';
  const DEFAULTS = { theme: 'auto', accent: 'jade', font: 'noto' };
  const root = document.documentElement;
  const current = k => root.getAttribute('data-' + k) || DEFAULTS[k];

  function mark() {
    for (const group of document.querySelectorAll('.opts[data-pref]')) {
      const value = current(group.dataset.pref);
      for (const b of group.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === value);
    }
  }
  function setPref(k, v) {
    if (v === DEFAULTS[k]) root.removeAttribute('data-' + k); else root.setAttribute('data-' + k, v);
    try { localStorage.setItem('qn-' + k, v); } catch {}
    mark();
  }
  function closeAll(except) {
    for (const fab of document.querySelectorAll('.fab')) {
      const open = fab.dataset.panel === except;
      document.getElementById(fab.dataset.panel).classList.toggle('hidden', !open);
      fab.setAttribute('aria-expanded', open);
    }
  }

  for (const fab of document.querySelectorAll('.fab')) {
    fab.onclick = () => closeAll(fab.getAttribute('aria-expanded') === 'true' ? null : fab.dataset.panel);
  }
  for (const group of document.querySelectorAll('.opts[data-pref]')) {
    group.onclick = e => { const b = e.target.closest('button'); if (b) setPref(group.dataset.pref, b.dataset.v); };
  }
  // 點面板以外的地方或按 Esc 就關閉
  document.addEventListener('click', e => { if (!e.target.closest('.fab-wrap')) closeAll(null); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(null); });
  mark();
})();
</script>

<script>
(() => {
  'use strict';
  // 後端（Supabase 專案）網址，和 QuickDrop 共用同一個專案
  const SUPABASE_URL = 'https://waedocvudiyxtlywtzqq.supabase.co';
  const PW_KEY = 'qn-password';
  const VIEW_KEY = 'qn-view';
  const PAPERS = ['#fff3a3', '#ffd8a8', '#ffc9de', '#d0ebff', '#c3fae8', '#e5dbff', '#d8f5a2'];
  const VIS_TEXT = { public: '公', private: '私' };

  const $ = s => document.querySelector(s);

  let toastTimer;
  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', isErr ? 5000 : 2500);
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    const year = d.getFullYear() === new Date().getFullYear() ? '' : d.getFullYear() + '/';
    return `${year}${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function hash(s) {
    let h = 0;
    for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return h;
  }
  function setSeg(el, value) {
    for (const b of el.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === value);
  }

  // ================= 下載成 Markdown =================
  // 開頭用 YAML front matter 記下類別、公私與時間，其他筆記軟體（Obsidian 等）也讀得懂
  function toMarkdown(n) {
    const q = s => JSON.stringify(s);   // JSON 字串也是合法的 YAML 字串，特殊字元不會出錯
    return [
      '---',
      `title: ${q(n.title)}`,
      `category: ${q(n.category)}`,
      `visibility: ${n.visibility}`,
      `created: ${n.created_at}`,
      `updated: ${n.updated_at}`,
      '---',
      '',
      ...(n.title ? [`# ${n.title}`, ''] : []),
      n.content.replace(/\s+$/, ''),
      '',
    ].join('\n');
  }
  // 檔名不能有 Windows 不允許的字元，也不要太長
  function safeName(s, fallback) {
    const out = String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').slice(0, 60);
    return out || fallback;
  }
  function fileName(n) {
    const d = new Date(n.created_at);
    const pad = x => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${safeName(n.title, '未命名')}.md`;
  }
  // 同名檔案加上編號，避免打包時互相覆蓋
  function uniqueName(used, name) {
    let out = name;
    const dot = name.lastIndexOf('.');
    for (let i = 2; used.has(out.toLowerCase()); i++) out = `${name.slice(0, dot)} (${i})${name.slice(dot)}`;
    used.add(out.toLowerCase());
    return out;
  }
  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }

  // 最簡單的 ZIP 格式（不壓縮）：文字檔很小，不需要另外載入壓縮函式庫
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // files：[{ name, text, date }]；name 可以含「資料夾/」
  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      const d = f.date;
      const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      const date = ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);      // 檔名用 UTF-8，中文檔名才不會變亂碼
      local.setUint16(10, time, true);
      local.setUint16(12, date, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, name.length, true);
      parts.push(local, name, data);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true);
      cen.setUint16(4, 20, true);
      cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true);
      cen.setUint16(12, time, true);
      cen.setUint16(14, date, true);
      cen.setUint32(16, crc, true);
      cen.setUint32(20, data.length, true);
      cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true);
      cen.setUint32(42, offset, true);
      central.push(cen, name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((n, p) => n + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, size, true);
    end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end], { type: 'application/zip' });
  }

  async function api(action, payload) {
    let res;
    try {
      res = await fetch(SUPABASE_URL + '/functions/v1/notes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...payload }),
      });
    } catch { throw new Error('連不上伺服器，請檢查網路'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || data.message || `伺服器錯誤（${res.status}）`);
    return data;
  }

  if (!SUPABASE_URL) $('#configBanner').classList.remove('hidden');
  else unlock();

  // ================= 解鎖 =================
  function unlock() {
    $('#unlockCard').classList.remove('hidden');
    let busy = false;

    async function open() {
      const password = $('#password').value;
      if (busy) return;
      if (!password) { toast('請輸入密碼', true); return; }
      busy = true;
      $('#btnUnlock').disabled = true;
      try {
        const first = await api('list', { password });
        try {
          if ($('#optRemember').checked) localStorage.setItem(PW_KEY, password);
          else localStorage.removeItem(PW_KEY);
        } catch {}
        $('#unlockCard').classList.add('hidden');
        $('#btnLock').classList.remove('hidden');
        board(password, first.notes);
      } catch (e) {
        toast(e.message, true);
      } finally {
        busy = false;
        $('#btnUnlock').disabled = false;
      }
    }

    $('#btnUnlock').onclick = open;
    $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
    $('#btnLock').onclick = () => {
      try { localStorage.removeItem(PW_KEY); } catch {}
      location.reload();
    };
    try {
      const saved = localStorage.getItem(PW_KEY);
      if (saved) { $('#password').value = saved; $('#optRemember').checked = true; open(); }
    } catch {}
  }

  // ================= 備忘錄 =================
  function board(password, notes) {
    $('#notesView').classList.remove('hidden');
    let view = 'board';
    try { if (localStorage.getItem(VIEW_KEY) === 'list') view = 'list'; } catch {}
    let vis = 'all';
    let cat = null;       // null：全部類別；''：未分類
    let query = '';

    const catName = c => c || '未分類';

    function visible() {
      const q = query.trim().toLowerCase();
      return notes.filter(n =>
        (vis === 'all' || n.visibility === vis) &&
        (cat === null || n.category === cat) &&
        (!q || [n.title, n.content, n.category].some(t => t.toLowerCase().includes(q))));
    }

    function renderChips() {
      const counts = new Map();
      for (const n of notes) counts.set(n.category, (counts.get(n.category) || 0) + 1);
      if (cat !== null && !counts.has(cat)) cat = null;
      // 有名字的類別依筆數排序，未分類放最後
      const cats = [...counts.keys()].sort((a, b) => !a - !b || counts.get(b) - counts.get(a) || a.localeCompare(b));
      const chip = (value, label, count) =>
        `<button class="chip" ${value === null ? 'data-all' : `data-cat="${escapeHtml(value)}"`} aria-pressed="${cat === value}">${escapeHtml(label)}<small>${count}</small></button>`;
      $('#chips').innerHTML = chip(null, '全部類別', notes.length) + cats.map(c => chip(c, catName(c), counts.get(c))).join('');
      $('#catList').innerHTML = cats.filter(Boolean).map(c => `<option value="${escapeHtml(c)}">`).join('');
    }

    // 便利貼底色：未分類固定用第一色，其餘類別依最早建立的順序輪流配色，相鄰類別不會撞色
    function paperOf() {
      const first = new Map();
      for (const n of notes) {
        if (n.category && !(first.get(n.category) <= n.created_at)) first.set(n.category, n.created_at);
      }
      const order = [...first.keys()].sort((a, b) => first.get(a).localeCompare(first.get(b)) || a.localeCompare(b));
      return c => PAPERS[c ? 1 + order.indexOf(c) % (PAPERS.length - 1) : 0];
    }

    const meta = n =>
      `<div class="meta"><span class="tag ${n.visibility}">${VIS_TEXT[n.visibility]}</span><span class="tag">${escapeHtml(catName(n.category))}</span><span>${fmtTime(n.updated_at)}</span></div>`;

    // ---------- 便利貼放大預覽：滑鼠停在便利貼上，用同樣底色的大卡片顯示完整內容 ----------
    // 只在有滑鼠的裝置啟用；預覽卡不接收滑鼠事件，所以不會擋住或打斷 hover
    const pv = $('#preview');
    const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
    let hoverEl = null;
    let hoverTimer = 0;

    function hidePreview() {
      clearTimeout(hoverTimer);
      hoverEl = null;
      pv.classList.add('hidden');
    }
    function showPreview(el) {
      const n = notes.find(x => x.id === el.dataset.id);
      if (!n || !el.isConnected) return;
      pv.style.setProperty('--paper', el.style.getPropertyValue('--paper'));
      pv.querySelector('.pv-title').textContent = n.title;
      pv.querySelector('.pv-title').classList.toggle('hidden', !n.title);
      pv.querySelector('.pv-text').textContent = n.content;
      pv.querySelector('.pv-text').scrollTop = 0;
      pv.querySelector('.meta').innerHTML = meta(n).replace(/^<div class="meta">|<\/div>$/g, '') +
        (n.created_at !== n.updated_at ? `<span>建立 ${fmtTime(n.created_at)}</span>` : '');
      // 放在便利貼旁邊空間比較大的那一側；兩側都太窄（例如視窗很小）就置中
      const gap = 16, r = el.getBoundingClientRect();
      const spaceRight = innerWidth - r.right - gap * 2, spaceLeft = r.left - gap * 2;
      let width = Math.min(640, Math.max(spaceRight, spaceLeft));
      let x;
      if (width >= 360) x = spaceRight >= spaceLeft ? r.right + gap : r.left - gap - width;
      else { width = Math.min(640, innerWidth - gap * 2); x = (innerWidth - width) / 2; }
      pv.style.width = width + 'px';
      pv.style.left = x + 'px';
      pv.classList.remove('hidden');
      // 先顯示才量得到高度，再讓卡片和便利貼垂直置中對齊，但不超出視窗
      const h = pv.offsetHeight;
      pv.style.top = Math.max(gap, Math.min(r.top + r.height / 2 - h / 2, innerHeight - h - gap)) + 'px';
      const text = pv.querySelector('.pv-text');
      pv.querySelector('.pv-more').classList.toggle('hidden', text.scrollHeight <= text.clientHeight);
    }

    if (canHover) {
      const boardEl = $('#board');
      boardEl.addEventListener('mouseover', e => {
        const el = e.target.closest('.sticky');
        if (el === hoverEl) return;
        if (!el) { hidePreview(); return; }
        const showing = !pv.classList.contains('hidden');
        clearTimeout(hoverTimer);
        hoverEl = el;
        // 第一次停留稍等一下，避免滑鼠只是經過就跳出來；已經在預覽時換便利貼就立刻切換
        hoverTimer = setTimeout(() => showPreview(el), showing ? 0 : 250);
      });
      boardEl.addEventListener('mouseleave', hidePreview);
      // 內容太長時，在便利貼上滾動滑鼠滾輪就捲動預覽卡
      boardEl.addEventListener('wheel', e => {
        const text = pv.querySelector('.pv-text');
        if (pv.classList.contains('hidden') || text.scrollHeight <= text.clientHeight) return;
        e.preventDefault();
        text.scrollTop += e.deltaY;
      }, { passive: false });
      addEventListener('scroll', hidePreview, { passive: true });
      addEventListener('resize', hidePreview);
    }

    function render() {
      hidePreview();
      renderChips();
      setSeg($('#visFilter'), vis);
      setSeg($('#viewToggle'), view);
      const shown = visible();
      $('#board').classList.toggle('hidden', view !== 'board' || !shown.length);
      $('#list').classList.toggle('hidden', view !== 'list' || !shown.length);
      $('#empty').classList.toggle('hidden', !!shown.length);
      $('#empty').textContent = notes.length ? '沒有符合條件的備忘錄。' : '還沒有備忘錄，按「＋ 新增」寫第一則。';
      $('#btnZip').disabled = !shown.length;
      $('#btnZip').textContent = shown.length === notes.length ? `⬇ 全部打包（${shown.length}）` : `⬇ 打包篩選結果（${shown.length}）`;
      if (view === 'board') {
        const paper = paperOf();
        $('#board').innerHTML = shown.map(n => {
          const tilt = (hash(n.id) % 7 - 3) * 0.5;
          return `<article class="sticky" tabindex="0" data-id="${escapeHtml(n.id)}" style="--paper:${paper(n.category)};--tilt:${tilt}deg">
            ${n.title ? `<div class="title">${escapeHtml(n.title)}</div>` : ''}
            <div class="text">${escapeHtml(n.content)}</div>
            ${meta(n)}
          </article>`;
        }).join('');
      } else {
        $('#list').innerHTML = shown.map(n => `<div class="item" tabindex="0" data-id="${escapeHtml(n.id)}">
          <div class="body">
            <div class="title">${escapeHtml(n.title || '（無標題）')}</div>
            ${n.content ? `<div class="snippet">${escapeHtml(n.content)}</div>` : ''}
            ${meta(n)}
          </div>
          <div class="actions">
            <button class="btn ghost small" data-edit>編輯</button>
            <button class="btn ghost small" data-md title="下載成 Markdown 檔">下載</button>
            <button class="btn ghost small danger" data-del>刪除</button>
          </div>
        </div>`).join('');
      }
    }

    async function reload() {
      $('#btnRefresh').disabled = true;
      try { notes = (await api('list', { password })).notes; render(); }
      catch (e) { toast(e.message, true); }
      $('#btnRefresh').disabled = false;
    }

    function downloadOne(note) {
      saveBlob(new Blob([toMarkdown(note)], { type: 'text/markdown;charset=utf-8' }), fileName(note));
    }
    // 打包目前畫面上（篩選後）的備忘錄，每個類別一個資料夾
    function downloadZip() {
      const shown = visible();
      if (!shown.length) return;
      const used = new Set();
      const files = shown.map(n => ({
        name: uniqueName(used, `${safeName(catName(n.category), '未分類')}/${fileName(n)}`),
        text: toMarkdown(n),
        date: new Date(n.updated_at),
      }));
      const d = new Date();
      const pad = x => String(x).padStart(2, '0');
      saveBlob(makeZip(files), `QuickNote_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.zip`);
      toast(`已打包 ${files.length} 則備忘錄`);
    }

    async function remove(note) {
      if (!confirm(`確定刪除「${note.title || '（無標題）'}」？刪除後無法復原。`)) return false;
      try {
        await api('remove', { password, id: note.id });
        notes = notes.filter(n => n.id !== note.id);
        render();
        toast('已刪除');
        return true;
      } catch (e) { toast(e.message, true); return false; }
    }

    // ---------- 編輯視窗 ----------
    const dlg = $('#editor');
    let editing = null;   // 修改中的備忘錄；新增時為 null
    let original = '';
    let fVis = 'private';
    let saving = false;

    const form = () => ({ title: $('#fTitle').value, content: $('#fContent').value, category: $('#fCategory').value, visibility: fVis });
    const setVis = v => { fVis = v; setSeg($('#fVis'), v); };

    function openEditor(note) {
      hidePreview();
      editing = note || null;
      $('#editorHeading').textContent = note ? '修改備忘錄' : '新增備忘錄';
      $('#fTitle').value = note?.title ?? '';
      $('#fContent').value = note?.content ?? '';
      // 新增時預設帶入目前篩選中的類別與公私
      $('#fCategory').value = note ? note.category : cat || '';
      setVis(note ? note.visibility : vis === 'public' ? 'public' : 'private');
      $('#btnDelete').classList.toggle('hidden', !note);
      original = JSON.stringify(form());
      dlg.showModal();
      $(note ? '#fContent' : '#fTitle').focus();
    }
    function closeEditor(force) {
      if (saving) return;
      if (!force && JSON.stringify(form()) !== original && !confirm('尚未儲存，確定放棄修改？')) return;
      dlg.close();
    }

    async function save() {
      if (saving) return;
      const data = form();
      if (!data.title.trim() && !data.content.trim()) { toast('標題和內容至少要填一項', true); return; }
      saving = true;
      $('#btnSave').disabled = true;
      try {
        const { note } = await api('save', { password, id: editing?.id, ...data });
        notes = [note, ...notes.filter(n => n.id !== note.id)];
        saving = false;
        closeEditor(true);
        render();
        toast(editing ? '已儲存' : '已新增');
      } catch (e) { toast(e.message, true); }
      saving = false;
      $('#btnSave').disabled = false;
    }

    async function classify() {
      const { title, content } = form();
      if (!title.trim() && !content.trim()) { toast('先寫點標題或內容，AI 才能分類', true); return; }
      $('#btnClassify').disabled = true;
      try {
        const { category } = await api('classify', { password, title, content });
        $('#fCategory').value = category;
        toast(`AI 建議類別：${category}`);
      } catch (e) { toast(e.message, true); }
      $('#btnClassify').disabled = false;
    }

    // ---------- 事件 ----------
    $('#btnNew').onclick = () => openEditor();
    $('#btnRefresh').onclick = reload;
    $('#btnZip').onclick = downloadZip;
    $('#search').oninput = e => { query = e.target.value; render(); };
    $('#visFilter').onclick = e => { const b = e.target.closest('button'); if (b) { vis = b.dataset.v; render(); } };
    $('#viewToggle').onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      view = b.dataset.v;
      try { localStorage.setItem(VIEW_KEY, view); } catch {}
      render();
    };
    $('#chips').onclick = e => {
      const b = e.target.closest('.chip');
      if (b) { cat = b.dataset.cat ?? null; render(); }
    };
    for (const el of [$('#board'), $('#list')]) {
      const pick = e => notes.find(n => n.id === e.target.closest('[data-id]')?.dataset.id);
      el.addEventListener('click', e => {
        const note = pick(e);
        if (!note) return;
        if (e.target.closest('[data-del]')) remove(note);
        else if (e.target.closest('[data-md]')) downloadOne(note);
        else openEditor(note);
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.matches('[data-id]')) openEditor(pick(e));
      });
    }

    $('#fVis').onclick = e => { const b = e.target.closest('button'); if (b) setVis(b.dataset.v); };
    $('#btnSave').onclick = save;
    $('#btnCancel').onclick = () => closeEditor();
    $('#btnClassify').onclick = classify;
    $('#btnDelete').onclick = async () => { if (await remove(editing)) closeEditor(true); };
    // 下載的是編輯視窗裡目前的內容（包含還沒儲存的修改）
    $('#btnMd').onclick = () => {
      const data = form();
      if (!data.title.trim() && !data.content.trim()) { toast('標題和內容至少要填一項', true); return; }
      const now = new Date().toISOString();
      downloadOne({ ...data, title: data.title.trim(), category: data.category.trim(),
        created_at: editing?.created_at ?? now, updated_at: editing?.updated_at ?? now });
    };
    dlg.addEventListener('cancel', e => { e.preventDefault(); closeEditor(); });
    dlg.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save(); });

    render();
  }
})();
</script>
</body>
</html>
